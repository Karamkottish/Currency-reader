<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="'Segoe UI', Inter, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A65A"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3CCBA8"/></marker></defs><rect width="1600" height="1130" fill="#0F1F2E"/><text x="60" y="84" font-size="46" font-weight="700" fill="#F5EDDD" text-anchor="start">How the API answers one question</text><text x="60" y="126" font-size="22" font-weight="400" fill="#B4BFC7" text-anchor="start">POST /v1/ask, the main request. Follow the numbers 1 to 8.</text><text x="1540" y="84" font-size="20" font-weight="600" fill="#F2A65A" text-anchor="end">orange: the question goes out</text><text x="1540" y="114" font-size="20" font-weight="600" fill="#3CCBA8" text-anchor="end">green: the answer comes back</text><rect x="60" y="330" width="250" height="170" rx="18" fill="#16324A" stroke="#3CCBA8" stroke-width="3"/><text x="86" y="378.4" font-size="28" font-weight="700" fill="#F5EDDD" text-anchor="start">Phone app</text><text x="86" y="423.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">asks a question:</text><text x="86" y="454.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">“What is the 20</text><text x="86" y="485.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">note made of?”</text><rect x="560" y="300" width="330" height="230" rx="18" fill="#16324A" stroke="#F2A65A" stroke-width="3"/><text x="586" y="348.4" font-size="28" font-weight="700" fill="#F5EDDD" text-anchor="start">API  (NestJS)</text><text x="586" y="393.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">The coordinator. It</text><text x="586" y="424.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">calls the others and</text><text x="586" y="455.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">streams the reply.</text><text x="586" y="486.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">Then saves it (8).</text><rect x="1160" y="150" width="400" height="150" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="1186" y="198.4" font-size="28" font-weight="700" fill="#F5EDDD" text-anchor="start">Cache  (Valkey)</text><text x="1186" y="243.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">If yes, 3: reply with the</text><text x="1186" y="274.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">saved answer, skip 4 to 6.</text><rect x="1160" y="340" width="400" height="150" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="1186" y="388.4" font-size="28" font-weight="700" fill="#F5EDDD" text-anchor="start">Database  (Postgres)</text><text x="1186" y="433.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">Finds the 5 best facts:</text><text x="1186" y="464.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">keyword + meaning search.</text><rect x="1160" y="590" width="400" height="170" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="1186" y="638.4" font-size="28" font-weight="700" fill="#F5EDDD" text-anchor="start">Model  (llama-server)</text><text x="1186" y="683.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">Writes the answer using</text><text x="1186" y="714.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">only those facts, one</text><text x="1186" y="745.4" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">word at a time.</text><path d="M310 385 H556" fill="none" stroke="#F2A65A" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="435" y="368" font-size="20" font-weight="600" fill="#F2A65A" text-anchor="middle" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">1  POST /v1/ask</text><path d="M560 455 H314" fill="none" stroke="#3CCBA8" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ag)"/><text x="435" y="492" font-size="20" font-weight="600" fill="#3CCBA8" text-anchor="middle" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">7  words stream back</text><path d="M890 340 H1000 V225 H1156" fill="none" stroke="#F2A65A" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="990" y="214" font-size="20" font-weight="600" fill="#F2A65A" text-anchor="end" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">2  seen it before?</text><path d="M890 415 H1156" fill="none" stroke="#F2A65A" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1025" y="400" font-size="20" font-weight="600" fill="#F2A65A" text-anchor="middle" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">4  on a miss: find facts</text><path d="M890 490 H1050 V640 H1156" fill="none" stroke="#F2A65A" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="902" y="474" font-size="20" font-weight="600" fill="#F2A65A" text-anchor="start" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">5  facts + question</text><path d="M1160 715 H1000 V515 H894" fill="none" stroke="#3CCBA8" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ag)"/><text x="990" y="744" font-size="20" font-weight="600" fill="#3CCBA8" text-anchor="end" stroke="#0F1F2E" stroke-width="9" paint-order="stroke" stroke-linejoin="round">6  answer, word by word</text><line x1="60" y1="808" x2="1540" y2="808" stroke="#2A4A66" stroke-width="2"/><text x="60" y="858" font-size="34" font-weight="700" fill="#F5EDDD" text-anchor="start">Learn it in this order</text><rect x="60" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="82" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Web basics</text><text x="82" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">request in,</text><text x="82" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">response out,</text><text x="82" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">JSON, status codes</text><circle cx="265" cy="916" r="17" fill="#F2A65A"/><text x="265" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">1</text><path d="M298 981 H310" stroke="#3CCBA8" stroke-width="3" marker-end="url(#ag)"/><rect x="313" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="335" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Hello API</text><text x="335" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">NestJS + Fastify</text><text x="335" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">GET /health</text><text x="335" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">returns “ok”</text><circle cx="518" cy="916" r="17" fill="#F2A65A"/><text x="518" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">2</text><path d="M551 981 H563" stroke="#3CCBA8" stroke-width="3" marker-end="url(#ag)"/><rect x="566" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="588" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Fake answer</text><text x="588" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">POST /v1/ask</text><text x="588" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">streams canned</text><text x="588" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">words (SSE)</text><circle cx="771" cy="916" r="17" fill="#F2A65A"/><text x="771" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">3</text><path d="M804 981 H816" stroke="#3CCBA8" stroke-width="3" marker-end="url(#ag)"/><rect x="819" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="841" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Database</text><text x="841" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">Postgres in Docker</text><text x="841" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">store currencies</text><text x="841" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">and facts</text><circle cx="1024" cy="916" r="17" fill="#F2A65A"/><text x="1024" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">4</text><path d="M1057 981 H1069" stroke="#3CCBA8" stroke-width="3" marker-end="url(#ag)"/><rect x="1072" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="1094" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Search</text><text x="1094" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">find the facts for</text><text x="1094" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">a question</text><text x="1094" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">(keyword + meaning)</text><circle cx="1277" cy="916" r="17" fill="#F2A65A"/><text x="1277" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">5</text><path d="M1310 981 H1322" stroke="#3CCBA8" stroke-width="3" marker-end="url(#ag)"/><rect x="1325" y="886" width="235" height="190" rx="18" fill="#16324A" stroke="#2A4A66" stroke-width="2"/><text x="1347" y="927.2" font-size="24" font-weight="700" fill="#F5EDDD" text-anchor="start">Real model</text><text x="1347" y="970.6500000000001" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">swap the fake for</text><text x="1347" y="1000.1" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">llama-server,</text><text x="1347" y="1029.55" font-size="19" font-weight="400" fill="#B4BFC7" text-anchor="start">then add the cache</text><circle cx="1530" cy="916" r="17" fill="#F2A65A"/><text x="1530" y="923" font-size="20" font-weight="700" fill="#0F1F2E" text-anchor="middle">6</text><text x="60" y="1110" font-size="20" font-weight="400" fill="#B4BFC7" text-anchor="start">Same trick as the app: build against a fake first. The app has FakeInferenceEngine; the API gets a fake model service.</text></svg>